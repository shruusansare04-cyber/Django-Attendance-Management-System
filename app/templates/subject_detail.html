<!DOCTYPE html>
<html>

<head>

    <title>Subject Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .detail-card {
            max-width: 600px;
            margin: 80px auto;
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }

        .header {
            background: #212529;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .subject-icon {
            font-size: 55px;
        }

        .subject-name {
            font-weight: 700;
            margin-top: 10px;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .label {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 18px;
            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card detail-card shadow">


        <!-- Header -->

        <div class="header">

            <div class="subject-icon">
                📚
            </div>

            <h2 class="subject-name">
                {{ subject.name }}
            </h2>

            <p class="mb-0">
                Subject Details
            </p>

        </div>


        <!-- Details -->

        <div class="card-body p-4">


            <!-- Subject Name -->

            <div class="info-box">

                <div class="label">
                    Subject Name
                </div>

                <div class="value">
                    {{ subject.name }}
                </div>

            </div>


            <!-- Subject Code -->

            <div class="info-box">

                <div class="label">
                    Subject Code
                </div>

                <div class="value">
                    {{ subject.code }}
                </div>

            </div>


            <!-- Buttons -->

            <div class="text-center mt-4">

                <a
                    href="{% url 'subject_list' %}"
                    class="btn btn-outline-secondary"
                >
                    ← Back to Subjects
                </a>

                <a
                    href="{% url 'add_subject' %}"
                    class="btn btn-primary"
                >
                    + Add Subject
                </a>

            </div>


        </div>

    </div>

</div>

</body>

</html>
