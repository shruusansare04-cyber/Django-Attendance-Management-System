<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Attendance System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border: none;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            padding: 35px 25px;
            text-align: center;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            background: white;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
        }

        .login-body {
            padding: 35px;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            border-color: #2563eb;
        }

        .login-btn {
            height: 50px;
            border-radius: 12px;
            font-weight: bold;
            background: #2563eb;
            border: none;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .back-home {
            text-decoration: none;
            color: #2563eb;
            font-weight: 500;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <!-- Header -->
        <div class="login-header">

            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>

            <h2 class="fw-bold mb-1">
                Welcome Back!
            </h2>

            <p class="mb-0">
                Login to Attendance System
            </p>

        </div>


        <!-- Body -->
        <div class="login-body">

            <!-- Error Message -->
            {% if error %}
                <div class="alert alert-danger text-center">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    {{ error }}
                </div>
            {% endif %}


            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <!-- Username -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-person me-1"></i>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-lock me-1"></i>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->
                <button type="submit"
                        class="btn btn-primary login-btn w-100">

                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login

                </button>

            </form>


            <!-- Back Home -->
            <div class="text-center mt-4">

                <a href="{% url 'home' %}" class="back-home">

                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Home

                </a>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
