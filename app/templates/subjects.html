<!DOCTYPE html>
<html>

<head>

    <title>Subject List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .main-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .page-title {
            font-weight: 700;
            color: #1f2937;
        }

        .subject-link {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }

        .subject-link:hover {
            text-decoration: underline;
        }

        .table th {
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .code-badge {
            padding: 7px 12px;
            border-radius: 20px;
        }

    </style>

</head>


<body>

<div class="container mt-5 mb-5">


    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                📚 Subject List
            </h2>

            <p class="text-muted mb-0">
                Manage subjects and subject codes
            </p>

        </div>


        <a
            href="{% url 'add_subject' %}"
            class="btn btn-primary"
        >
            + Add Subject
        </a>

    </div>



    <!-- Subject Table -->

    <div class="card main-card shadow">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">


                    <!-- Header -->

                    <thead class="table-dark">

                        <tr>

                            <th class="px-4 py-3">
                                ID
                            </th>

                            <th class="py-3">
                                Subject Name
                            </th>

                            <th class="py-3">
                                Subject Code
                            </th>

                        </tr>

                    </thead>



                    <!-- Body -->

                    <tbody>

                        {% for subject in subjects %}

                        <tr>


                            <!-- ID -->

                            <td class="px-4">
                                {{ subject.id }}
                            </td>



                            <!-- Subject Name -->

                            <td>

                                <a
                                    href="{% url 'subject_detail' subject.id %}"
                                    class="subject-link"
                                >
                                    📚 {{ subject.name }}
                                </a>

                            </td>



                            <!-- Subject Code -->

                            <td>

                                <span class="badge bg-primary code-badge">
                                    {{ subject.code }}
                                </span>

                            </td>


                        </tr>


                        {% empty %}

                        <!-- Empty State -->

                        <tr>

                            <td
                                colspan="3"
                                class="text-center py-5"
                            >

                                <h5 class="text-muted">
                                    No Subjects Found
                                </h5>

                                <p class="text-muted mb-3">
                                    Add your first subject.
                                </p>

                                <a
                                    href="{% url 'add_subject' %}"
                                    class="btn btn-primary"
                                >
                                    + Add Subject
                                </a>

                            </td>

                        </tr>

                        {% endfor %}


                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- Back Button -->

    <div class="mt-4">

        <a
            href="{% url 'admin_dashboard' %}"
            class="btn btn-outline-secondary"
        >
            ← Back to Dashboard
        </a>

    </div>


</div>


</body>

</html>
