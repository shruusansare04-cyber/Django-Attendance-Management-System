<!DOCTYPE html>
<html>

<head>

    <title>Edit Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .edit-card {
            max-width: 650px;
            margin: 60px auto;
            border: none;
            border-radius: 20px;
        }

        .title {
            font-weight: 700;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .btn {
            border-radius: 10px;
            padding: 11px 20px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card edit-card shadow">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="title">
                    ✏️ Edit Attendance
                </h2>

                <p class="text-muted">
                    Update attendance record
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}


                <!-- Student -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Student
                    </label>

                    <select
                        name="student"
                        class="form-select"
                        required
                    >

                        {% for student in students %}

                            <option
                                value="{{ student.id }}"
                                {% if student.id == attendance.student.id %}
                                    selected
                                {% endif %}
                            >

                                {{ student.name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Subject -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Subject
                    </label>

                    <select
                        name="subject"
                        class="form-select"
                        required
                    >

                        {% for subject in subjects %}

                            <option
                                value="{{ subject.id }}"
                                {% if subject.id == attendance.subject.id %}
                                    selected
                                {% endif %}
                            >

                                {{ subject.name }}
                                ({{ subject.code }})

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Date -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        class="form-control"
                        value="{{ attendance.date|date:'Y-m-d' }}"
                        required
                    >

                </div>


                <!-- Status -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Attendance Status
                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required
                    >

                        <option
                            value="present"
                            {% if attendance.status %}
                                selected
                            {% endif %}
                        >
                            Present
                        </option>

                        <option
                            value="absent"
                            {% if not attendance.status %}
                                selected
                            {% endif %}
                        >
                            Absent
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    💾 Save Changes
                </button>

            </form>


            <div class="text-center mt-4">

                <a
                    href="{% url 'attendance_list' %}"
                    class="text-secondary text-decoration-none"
                >
                    ← Back to Attendance
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
