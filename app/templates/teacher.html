<!DOCTYPE html>
<html>
<head>
    <title>Add Teacher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }

        .teacher-card {
            max-width: 600px;
            margin: 60px auto;
            border: none;
            border-radius: 20px;
        }

        .teacher-title {
            font-weight: 700;
            color: #1f2937;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-add {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .back-btn {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card teacher-card shadow">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="teacher-title">
                    👨‍🏫 Add Teacher
                </h2>

                <p class="text-muted">
                    Add teacher details and assign a subject
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <!-- Teacher Name -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Teacher Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter teacher name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter teacher email"
                        required
                    >

                </div>


                <!-- Subject -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Subject
                    </label>

                    <select
                        name="subject"
                        class="form-select"
                        required
                    >

                        <option value="" selected disabled>
                            Select Subject
                        </option>

                        {% for subject in subjects %}

                            <option value="{{ subject.id }}">
                                {{ subject.name }} ({{ subject.code }})
                            </option>

                        {% empty %}

                            <option disabled>
                                No subjects available
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="btn btn-primary btn-add w-100"
                >
                    ➕ Add Teacher
                </button>

            </form>


            <div class="text-center mt-4">

                <a
                    href="{% url 'teacher_list' %}"
                    class="back-btn text-secondary"
                >
                    ← Back to Teachers
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
