
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject List | Attendance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #172554;
        }

        .page-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        .page-title {
            color: #172554;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #64748b;
            font-size: 18px;
        }

        .btn-add {
            background: linear-gradient(135deg, #0B132B, #3A506B);
            color: white;
            border: none;
            padding: 12px 19px;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn-add:hover {
            background: #0B132B;
            color: white;
        }

        .subject-card {
            border: none;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.14);
            margin-top: 28px;
        }

        .subject-table {
            margin: 0;
            vertical-align: middle;
        }

        .subject-table thead th {
            background: #1C2541;
            color: white;
            border: none;
            padding: 23px 30px;
            font-size: 18px;
            font-weight: 600;
        }

        .subject-table tbody td {
            padding: 15px 30px;
            border-color: #dbe2ea;
            font-size: 17px;
            color: #111827;
        }

        .subject-table tbody tr:hover td {
            background: #eef2ff;
        }

        .subject-name {
            color: #1d4ed8;
            font-weight: 600;
            text-decoration: none;
        }

        .subject-name:hover {
            color: #0B132B;
        }

        .subject-code {
            display: inline-block;
            background: #1C2541;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 11px 17px;
            color: #475569;
            border: 1px solid #64748b;
            border-radius: 8px;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #1C2541;
            color: white;
            border-color: #1C2541;
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 20px 12px;
            }

            .page-title {
                font-size: 28px;
            }

            .subject-table thead th,
            .subject-table tbody td {
                padding: 14px 12px;
                font-size: 14px;
                white-space: nowrap;
            }

            .top-header {
                align-items: flex-start !important;
                gap: 15px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="page-container">

    <div class="d-flex justify-content-between align-items-center top-header">
        <div>
            <h1 class="page-title">📚 Subject List</h1>
            <p class="page-subtitle mb-0">
                Manage subjects and subject codes
            </p>
        </div>

        <a href="{% url 'add_subject' %}" class="btn btn-add">
            + Add Subject
        </a>
    </div>

    <div class="card subject-card">
        <div class="table-responsive">
            <table class="table subject-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Subject Name</th>
                        <th>Subject Code</th>
                    </tr>
                </thead>

                <tbody>
                    {% for subject in subjects %}
                    <tr>
                        <td>{{ subject.id }}</td>

                        <td>
                            <span class="me-1">📚</span>
                            <a href="#" class="subject-name">
                                {{ subject.name }}
                            </a>
                        </td>

                        <td>
                            <span class="subject-code">
                                {{ subject.code }}
                            </span>
                        </td>
                    </tr>

                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-5 text-secondary">
                            No subjects found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <a href="{% url 'home' %}" class="btn-back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
