<!DOCTYPE html>
<html>

<head>

    <title>Edit Subject</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .edit-card {
            max-width: 600px;
            margin: 70px auto;
            border: none;
            border-radius: 20px;
        }

        .title {
            font-weight: 700;
            color: #1f2937;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-save {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card edit-card shadow">

        <div class="card-body p-4 p-md-5">


            <!-- Title -->

            <div class="text-center mb-4">

                <h2 class="title">
                    ✏️ Edit Subject
                </h2>

                <p class="text-muted">
                    Update subject information
                </p>

            </div>


            <!-- Form -->

            <form method="POST">

                {% csrf_token %}


                <!-- Subject Name -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ subject.name }}"
                        placeholder="Enter subject name"
                        required
                    >

                </div>


                <!-- Subject Code -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Subject Code
                    </label>

                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        value="{{ subject.code }}"
                        placeholder="Enter subject code"
                        required
                    >

                </div>


                <!-- Save -->

                <button
                    type="submit"
                    class="btn btn-primary btn-save w-100"
                >
                    💾 Save Changes
                </button>

            </form>


            <!-- Back -->

            <div class="text-center mt-4">

                <a
                    href="{% url 'subject_detail' subject.id %}"
                    class="text-secondary text-decoration-none"
                >
                    ← Back to Subject Details
                </a>

            </div>


        </div>

    </div>

</div>

</body>

</html>
