<!DOCTYPE html>
<html>

<head>

    <title>Delete Teacher</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .delete-card {
            max-width: 550px;
            margin: 100px auto;
            border: none;
            border-radius: 20px;
        }

        .warning-icon {
            font-size: 60px;
        }

        .title {
            font-weight: 700;
            color: #dc3545;
        }

        .teacher-name {
            font-weight: 700;
            color: #212529;
        }

        .btn-delete {
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-cancel {
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card delete-card shadow">

        <div class="card-body text-center p-4 p-md-5">


            <!-- Warning -->

            <div class="warning-icon">
                ⚠️
            </div>


            <h2 class="title mt-3">
                Delete Teacher?
            </h2>


            <p class="text-muted mt-3">

                Are you sure you want to delete

                <br>

                <span class="teacher-name">
                    {{ teacher.name }}
                </span>

                ?

            </p>


            <p class="text-muted small">
                This action cannot be undone.
            </p>


            <!-- Confirmation Form -->

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger btn-delete me-2"
                >
                    🗑️ Yes, Delete
                </button>


                <a
                    href="{% url 'teacher_detail' teacher.id %}"
                    class="btn btn-outline-secondary btn-cancel"
                >
                    Cancel
                </a>

            </form>


        </div>

    </div>

</div>

</body>

</html>
