<!DOCTYPE html>
<html>

<head>

    <title>Edit Teacher</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .edit-card {
            max-width: 600px;
            margin: 60px auto;
            border: none;
            border-radius: 20px;
        }

        .title {
            font-weight: 700;
            color: #1f2937;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-save {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card edit-card shadow">

        <div class="card-body p-4 p-md-5">


            <!-- Title -->

            <div class="text-center mb-4">

                <h2 class="title">
                    ✏️ Edit Teacher
                </h2>

                <p class="text-muted">
                    Update teacher information
                </p>

            </div>


            <!-- Form -->

            <form method="POST">

                {% csrf_token %}


                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Teacher Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ teacher.name }}"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ teacher.email }}"
                        required
                    >

                </div>


                <!-- Subject -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Subject
                    </label>

                    <select
                        name="subject"
                        class="form-select"
                        required
                    >

                        <option value="" disabled>
                            Select Subject
                        </option>


                        {% for subject in subjects %}

                            <option
                                value="{{ subject.id }}"
                                {% if subject in teacher.subjects.all %}
                                    selected
                                {% endif %}
                            >

                                {{ subject.name }} ({{ subject.code }})

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Save -->

                <button
                    type="submit"
                    class="btn btn-primary btn-save w-100"
                >
                    💾 Save Changes
                </button>

            </form>


            <!-- Back -->

            <div class="text-center mt-4">

                <a
                    href="{% url 'teacher_detail' teacher.id %}"
                    class="text-secondary text-decoration-none"
                >
                    ← Back to Teacher Details
                </a>

            </div>


        </div>

    </div>

</div>

</body>

</html>
