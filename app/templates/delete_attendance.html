<!DOCTYPE html>
<html>

<head>

    <title>Delete Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
        }

        .delete-card {
            max-width: 550px;
            margin: 100px auto;
            border: none;
            border-radius: 20px;
        }

        .warning-icon {
            font-size: 60px;
        }

        .title {
            font-weight: 700;
            color: #dc3545;
        }

        .record {
            font-weight: 700;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card delete-card shadow">

        <div class="card-body text-center p-4 p-md-5">

            <div class="warning-icon">
                ⚠️
            </div>

            <h2 class="title mt-3">
                Delete Attendance?
            </h2>

            <p class="text-muted mt-3">

                Are you sure you want to delete this attendance record?

            </p>

            <div class="mb-4">

                <div class="record">
                    {{ attendance.student.name }}
                </div>

                <div>
                    {{ attendance.subject.name }}
                </div>

                <div>
                    {{ attendance.date }}
                </div>

            </div>


            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger me-2"
                >
                    🗑️ Yes, Delete
                </button>

                <a
                    href="{% url 'attendance_list' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
